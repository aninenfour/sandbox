<!doctype html>
<!-- Hotcoin poster template, 4:5 (1080 x 1350). Open in a browser, edit the text inside the EDIT blocks.
     Rules: brand-kit/claude-project-instructions.md. Logo below is the official mark as vector (99.7% match to the PNG): never edit its paths.
     Sizes: change --w/--h on .poster for 1:1 (1080x1080) or 16:9 (1920x1080); keep 64px gutters.
     Export: Chrome > right-click the poster > Inspect > select <div class="poster"> > Ctrl/Cmd+Shift+P > "Capture node screenshot".
     Set the browser zoom so devicePixelRatio = 2 (or use DevTools device toolbar, DPR 2) to get 2160 x 2700. -->
<html><head><meta charset="utf-8"><title>Hotcoin poster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@500;700;900&display=block">
<style>
:root{
  --ink:#07090A; --ink-2:#0B0E11; --lime:#B8F26A; --green:#7EC25A; --white:#FFFFFF;
  --muted:rgba(255,255,255,.62); --hairline:rgba(255,255,255,.22);
  --up:#17A86B; --down:#E5484D;
  --display:'Inter Tight','Noto Sans SC',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --gutter:64px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1d20;display:flex;justify-content:center;padding:40px}
.poster{--w:1080px;--h:1350px;width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--ink);color:var(--white);font-family:var(--display)}
/* background art: AI image (no text in it). Leave src empty to use the watermark style instead. */
.poster .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .shade{position:absolute;inset:0;background:linear-gradient(0deg,var(--ink) 0%,rgba(7,9,10,.9) 26%,rgba(7,9,10,0) 46%)}
/* signature move: the Hotcoin symbol, huge and faint, bleeding off the edge */
.poster .mark{position:absolute;right:-220px;top:180px;width:900px;height:900px;opacity:.06}
.top{position:absolute;left:var(--gutter);right:var(--gutter);top:62px;display:flex;justify-content:space-between;align-items:center}
.logo{height:38px;width:auto}
.pill{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:2.2px;padding:10px 18px;border-radius:99px;border:1.5px solid var(--lime);color:var(--lime);text-transform:uppercase}
.kicker{position:absolute;left:var(--gutter);top:176px;font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:6px;color:var(--lime);text-transform:uppercase}
h1{position:absolute;left:var(--gutter);right:var(--gutter);top:214px;font-weight:800;font-size:78px;letter-spacing:-3px;line-height:1.03}
h1 em{font-style:normal;color:var(--lime)}
.hero{position:absolute;left:58px;top:470px;display:flex;align-items:flex-end;gap:26px}
.hero .n{font-weight:900;font-size:280px;letter-spacing:-14px;line-height:.8;background:linear-gradient(180deg,#fff 20%,var(--lime) 140%);-webkit-background-clip:text;color:transparent;padding-right:12px}
.hero .l{font-size:38px;font-weight:700;letter-spacing:-.8px;line-height:1.15;padding-bottom:12px}
.stats{position:absolute;left:var(--gutter);right:var(--gutter);bottom:200px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--hairline)}
.stat{padding-top:24px}
.stat + .stat{padding-left:28px;border-left:1.5px solid var(--hairline)}
.stat .k{font-family:var(--mono);font-size:16px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;line-height:1.4}
.stat .v{font-weight:800;font-size:54px;letter-spacing:-2px;line-height:1;margin-top:12px}
.stat .v small{font-size:24px;font-weight:700;letter-spacing:-.4px;margin-left:8px;color:var(--lime)}
.cta{position:absolute;left:var(--gutter);right:var(--gutter);bottom:64px;display:flex;justify-content:space-between;align-items:center}
.cta .note{font-family:var(--mono);font-size:16px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}
.btn{display:flex;align-items:center;gap:14px;background:var(--lime);color:var(--ink);font-weight:800;font-size:28px;letter-spacing:-.4px;padding:20px 30px;border-radius:99px;box-shadow:0 0 70px rgba(184,242,106,.35)}
</style></head><body>
