<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Guess the meme, 3D: inflated glossy-black silhouette + inflated lime question marks + a lime sphere, soft studio light.
// Transparent background (Remotion adds the backdrop and type).
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1080), DPR = +(q.get('dpr') || 2);
const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(DPR); renderer.setSize(W, H); renderer.setClearColor(0, 0);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.02).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 100);
camera.position.set(0.6, 0.5, 13); camera.lookAt(0.9, -0.2, 0);

const data = await (await fetch('/art2/inflated.json')).json();
const geo = (d) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(d.p, 3)); g.setIndex(d.i); g.computeVertexNormals(); return g; };
const black = new THREE.MeshPhysicalMaterial({color: 0x050606, roughness: 0.3, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.12, sheen: 0.4, sheenColor: new THREE.Color(0x3a4a2a), sheenRoughness: 0.5});
const lime = new THREE.MeshPhysicalMaterial({color: 0xb8f26a, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.15, sheen: 0.6, sheenColor: new THREE.Color(0xffffff)});
const add = (g, m, s, pos, rot) => { const o = new THREE.Mesh(g, m); o.scale.setScalar(s); o.position.set(...pos); o.rotation.set(...rot); o.castShadow = true; o.receiveShadow = true; scene.add(o); return o; };
add(geo(data.peng), black, 3.45, [1.55, -1.55, 0], [0.04, -0.16, 0.02]);
const qg = geo(data.q);
add(qg, lime, 1.2, [2.95, 1.55, 0.6], [0.12, -0.3, 0.22]);
add(qg, lime, 0.62, [-1.05, -0.45, 0.9], [0.08, 0.3, -0.28]);
const sph = new THREE.Mesh(new THREE.SphereGeometry(0.24, 64, 64), lime); sph.position.set(2.75, -0.75, 1.4); sph.castShadow = true; scene.add(sph);

// soft studio light: big key from upper left, cool fill, lime kicker from the right
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-3, 5, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 14; key.shadow.blurSamples = 24; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, {left: -5, right: 5, top: 5, bottom: -5}); scene.add(key);
const kick = new THREE.PointLight(0xb8f26a, 26, 20, 1.6); kick.position.set(4, 0.5, -1.5); scene.add(kick);
scene.add(new THREE.HemisphereLight(0xffffff, 0xdfead2, 0.6));
// shadow catcher (back wall behind objects, tilted slightly)
const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({opacity: 0.1}));
wall.position.z = -0.75; wall.receiveShadow = true;
renderer.render(scene, camera);
document.title = 'ready';
</script>
</body></html>
