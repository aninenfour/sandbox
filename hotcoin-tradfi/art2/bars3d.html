<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// TradFi still: three bullion bars (BTC black glass, STOCKS graphite, GOLD metal), engraved, lime rim light.
// Transparent background; composited by art2/compose_bars.py.
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {FontLoader} from 'three/addons/loaders/FontLoader.js';
import {TextGeometry} from 'three/addons/geometries/TextGeometry.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1350), DPR = +(q.get('dpr') || 2);
const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(DPR); renderer.setSize(W, H); renderer.setClearColor(0, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;
const camera = new THREE.PerspectiveCamera(26, W / H, 0.1, 100);
camera.position.set(5.0, 7.6, 15.2); camera.lookAt(0, 0.75, 0);

const font = await new Promise((res) => new FontLoader().load('/node_modules/three/examples/fonts/helvetiker_bold.typeface.json', res));
const barGeo = (() => {
  const s = new THREE.Shape();
  s.moveTo(-1.0, 0); s.lineTo(1.0, 0); s.lineTo(0.8, 0.6); s.lineTo(-0.8, 0.6); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {depth: 2.5, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.06, bevelSegments: 8, curveSegments: 6});
  g.translate(0, 0, -1.25);
  return g;
})();
const mats = {
  btc: new THREE.MeshPhysicalMaterial({color: 0x0a0c0b, roughness: 0.18, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.05}),
  stk: new THREE.MeshPhysicalMaterial({color: 0x3a3f3c, roughness: 0.38, metalness: 0.85}),
  gold: new THREE.MeshPhysicalMaterial({color: 0xe0b54e, roughness: 0.22, metalness: 1.0, clearcoat: 0.4}),
};
const engr = {
  btc: new THREE.MeshPhysicalMaterial({color: 0xb8f26a, emissive: 0x4a7a14, emissiveIntensity: 0.6, roughness: 0.35}),
  stk: new THREE.MeshPhysicalMaterial({color: 0x1a1d1b, roughness: 0.6, metalness: 0.6}),
  gold: new THREE.MeshPhysicalMaterial({color: 0x8a6420, roughness: 0.5, metalness: 1.0}),
};
const label = (txt, mat, size) => {
  const g = new TextGeometry(txt, {font, size, depth: 0.03, curveSegments: 8, bevelEnabled: false});
  g.computeBoundingBox(); const b = g.boundingBox; g.translate(-(b.max.x + b.min.x) / 2, -(b.max.y + b.min.y) / 2, 0);
  const m = new THREE.Mesh(g, mat); m.rotation.x = -Math.PI / 2; return m;
};
const make = (key, txt, size, pos, ry) => {
  const grp = new THREE.Group();
  const m = new THREE.Mesh(barGeo, mats[key]); m.castShadow = true; m.receiveShadow = true; grp.add(m);
  m.rotation.y = Math.PI / 2;
  const t = label(txt, engr[key], size); t.position.set(0, 0.6 + 0.07 + 0.005, 0); grp.add(t);
  grp.position.set(...pos); grp.rotation.y = ry; scene.add(grp);
};
// a rising staircase: each bar steps up and back, like a bar chart made of bullion
make('btc', 'BTC', 0.46, [-0.55, 0, 2.15], 0);
make('stk', 'STOCKS', 0.4, [0, 0.95, 0], 0);
make('gold', 'GOLD', 0.46, [0.55, 1.9, -2.15], 0);

const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 9, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -5; key.shadow.camera.right = 5; key.shadow.camera.top = 5; key.shadow.camera.bottom = -5; scene.add(key);
const rim = new THREE.PointLight(0xb8f26a, 120, 40, 1.4); rim.position.set(6, 3, -4); scene.add(rim);
const rim2 = new THREE.PointLight(0x5fae3a, 60, 40, 1.4); rim2.position.set(-6, 1.5, -3); scene.add(rim2);
const fill = new THREE.DirectionalLight(0xb8f26a, 0.4); fill.position.set(4, 1, 8); scene.add(fill);
const plinth = new THREE.MeshPhysicalMaterial({color: 0x0b0d0c, roughness: 0.5});
[[0, 0.95, 0], [0.55, 1.9, -2.15]].forEach(([x, h, z]) => { const p = new THREE.Mesh(new THREE.BoxGeometry(2.0, h, 1.3), plinth); p.position.set(x, h / 2 - 0.07, z); p.castShadow = p.receiveShadow = true; scene.add(p); });
// shadow catcher
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({opacity: 0.55}));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.07; floor.receiveShadow = true; scene.add(floor);
renderer.render(scene, camera);
document.title = 'ready';
</script>
</body></html>
