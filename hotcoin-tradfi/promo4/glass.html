<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b1409;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Shot "glass": a liquid-glass BTC trade pill on a bed of soft felt spheres. The pill rises in, a finger
// presses along it (it dents and wobbles like jelly), the price ticks up and the inner glow surges, then the
// glass Buy button is pressed. Rendered frame by frame (window.renderFrame) with accumulation motion blur.
// Text and captions are added in Remotion (src/promo4/GlassShot.tsx). Assets live in promo4/glass-assets.
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1920), H = +(q.get('h') || 1080), FPS = 60, SUB = +(q.get('sub') || 8);
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16241a);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);

// ---------- helpers ----------
const cl = (x) => Math.max(0, Math.min(1, x));
const eOut = (x) => 1 - Math.pow(1 - cl(x), 4), eIO = (x) => { x = cl(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;
const spring = (t, k = 9, d = 4.2) => (t <= 0 ? 0 : 1 - Math.exp(-d * t) * Math.cos(k * t));
const loadImg = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const rnd = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();

// ---------- felt spheres ----------
const felt = (() => { // fuzzy bump: fine noise
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  const im = g.createImageData(S, S);
  for (let i = 0; i < S * S; i++) { const v = 128 + (rnd() - 0.5) * 200; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(14, 7); return t;
})();
const feltMat = (color, sheen) => new THREE.MeshPhysicalMaterial({color, roughness: 1, metalness: 0, sheen: 1, sheenRoughness: 0.45, sheenColor: new THREE.Color(sheen), bumpMap: felt, bumpScale: 3.2});
const PAL = [[0x1f3d16, 0x7ec25a], [0x2a5220, 0x9fd86a], [0x16301a, 0x5d9a48], [0x34601f, 0xb8f26a], [0x223a2a, 0x8fbf9a], [0x0f1712, 0x4a6a50], [0x3c4a3e, 0xc9dccb]];
const sphereGeo = new THREE.SphereGeometry(1, 64, 48);
const bed = new THREE.Group(); scene.add(bed);
for (let row = 0; row < 8; row++) {
  for (let i = -10 - row; i <= 10 + row; i++) {
    const r = 0.95 + rnd() * 0.35, [c, s] = PAL[Math.floor(rnd() * PAL.length)];
    const m = new THREE.Mesh(sphereGeo, feltMat(c, s));
    m.scale.setScalar(r);
    m.position.set(i * 1.75 + (row % 2) * 0.87 + (rnd() - 0.5) * 0.3, -1.75 + row * 0.85 + (rnd() - 0.5) * 0.3, -0.9 - row * 1.45);
    m.rotation.set(rnd() * 6, rnd() * 6, 0); m.castShadow = m.receiveShadow = true; bed.add(m);
  }
}
// the lime accent sphere behind the pill (reads as the colour seen through the glass)
const accent = new THREE.Mesh(sphereGeo, feltMat(0x2d5a1a, 0xb8f26a)); accent.scale.setScalar(1.55); accent.position.set(0.3, -0.35, -2.6); accent.castShadow = accent.receiveShadow = true; scene.add(accent);

// ---------- glass pill ----------
const R = 0.62, L = 3.2, ZS = 0.55;
const pillGeo = new THREE.CapsuleGeometry(R, L, 48, 128); pillGeo.rotateZ(Math.PI / 2); pillGeo.scale(1, 1, ZS);
const base = pillGeo.attributes.position.array.slice();
const glass = new THREE.MeshPhysicalMaterial({color: 0xffffff, transmission: 1, thickness: 0.7, roughness: 0.02, ior: 1.42, dispersion: 4, clearcoat: 1, clearcoatRoughness: 0.03,
  iridescence: 0.25, iridescenceIOR: 1.3, attenuationColor: new THREE.Color(0xf4fff0), attenuationDistance: 8, specularIntensity: 1, envMapIntensity: 1.3});
const pill = new THREE.Mesh(pillGeo, glass); pill.castShadow = true;
const rig = new THREE.Group(); rig.add(pill); scene.add(rig);
// inner glow: opaque gradient capsule inside the glass (so the transmission pass refracts it)
const glowGeo = new THREE.CapsuleGeometry(R * 0.32, L * 0.95, 16, 64); glowGeo.rotateZ(Math.PI / 2); glowGeo.scale(1, 1, 0.3);
const glowMat = new THREE.ShaderMaterial({toneMapped: false, uniforms: {t: {value: 0}, k: {value: 0.3}},
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform float t; uniform float k; varying vec3 vP;
    void main(){
      float x = vP.x / 2.3;
      vec3 a = vec3(0.72,0.95,0.42), b = vec3(0.18,0.74,0.52), c = vec3(0.95,1.0,0.75);
      vec3 col = mix(a, b, 0.5 + 0.5*sin(x*2.6 + t*1.7));
      col = mix(col, c, smoothstep(0.55, 1.0, sin(x*4.1 - t*2.3)*0.5+0.5) * 0.5);
      float fall = smoothstep(-0.55, 0.2, vP.y);
      gl_FragColor = vec4(col * (0.05 + k), 1.0);
    }`});
const glow = new THREE.Mesh(glowGeo, glowMat); glow.position.set(0, -0.3, -0.08); rig.add(glow);
// glass Buy button (right end)
const btnGeo = new THREE.SphereGeometry(0.47, 64, 48); btnGeo.scale(1, 1, 0.55);
const btnGlass = glass.clone(); btnGlass.thickness = 0.6; btnGlass.dispersion = 6;
const btn = new THREE.Mesh(btnGeo, btnGlass); btn.position.set(1.62, 0, 0.3); rig.add(btn);
const btnCore = new THREE.Mesh(new THREE.CircleGeometry(0.2, 64), new THREE.MeshBasicMaterial({color: 0x0b0e11})); btnCore.position.set(1.62, 0, 0.02); rig.add(btnCore);

// ---------- labels on the glass (canvas textures, redrawn when the price changes) ----------
const btcImg = await loadImg('/promo4/glass-assets/bitcoin.png');
const label = (() => {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 600; const g = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  let last = '';
  const draw = (price, chg) => {
    const key = price + chg; if (key === last) return; last = key;
    g.clearRect(0, 0, 2048, 600);
    g.save(); g.beginPath(); g.arc(250, 300, 120, 0, 7); g.clip(); g.drawImage(btcImg, 130, 180, 240, 240); g.restore();
    g.shadowColor = 'rgba(8,16,8,0.55)'; g.shadowBlur = 28; g.shadowOffsetY = 6;
    g.fillStyle = 'rgba(255,255,255,0.98)'; g.font = '700 210px "Helvetica Neue", Helvetica, Arial'; g.textBaseline = 'middle';
    g.fillText(price, 450, 270);
    g.fillStyle = '#C8FF7A'; g.font = '700 86px "Helvetica Neue", Helvetica, Arial'; g.fillText(chg, 460, 445);
    tex.needsUpdate = true;
  };
  return {tex, draw};
})();
const labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.4 * 0.78, 4.4 * 0.78 * 600 / 2048), new THREE.MeshBasicMaterial({map: label.tex, transparent: true, toneMapped: false}));
labelMesh.position.set(-0.55, 0.02, R * ZS + 0.025); rig.add(labelMesh);
const buyTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#B8F26A'; g.font = '700 92px "Helvetica Neue", Helvetica, Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('Buy', 128, 134);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const buy = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62), new THREE.MeshBasicMaterial({map: buyTex, transparent: true, toneMapped: false})); buy.position.set(1.62, 0, 0.58); rig.add(buy);

// ---------- lights ----------
const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(-3, 6, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 8; Object.assign(key.shadow.camera, {left: -8, right: 8, top: 6, bottom: -6}); key.shadow.bias = -0.0005; scene.add(key);
scene.add(new THREE.HemisphereLight(0xeaf7dc, 0x0b1409, 0.5));
const rim = new THREE.PointLight(0xb8f26a, 18, 14, 1.6); rim.position.set(3, 1.5, -2); scene.add(rim);
const glowLight = new THREE.PointLight(0xb8f26a, 0, 6, 2); glowLight.position.set(0, -0.6, 0.6); scene.add(glowLight);

// ---------- timeline (frames at 60 fps, 600 total) ----------
const P0 = 83189.44, P1 = 84052.10;
const pose = (f) => {
  const t = f / FPS;
  // A 0-1.5s rise, B 1.5-3.7s finger glides along (liquid), C 3.7-6.3s price ticks + glow surge,
  // D 6.3-8s push to the Buy button and press, E 8-10s pull back
  const rise = spring(t - 0.05, 7, 3.6);
  const push = eIO((f - 380) / 90), back = eIO((f - 480) / 100);
  camera.position.set(lerp(0.0, 1.25, push) - 0.35 * back, lerp(0.35, 0.1, push) + 0.1 * back, lerp(9.2, 5.2, push) + 1.6 * back - 0.4 * eIO(f / 380));
  camera.lookAt(lerp(0.0, 1.35, push) - 0.6 * back, lerp(-0.05, 0, push), 0);
  rig.position.set(0, lerp(-3.2, 0.15, rise) + 0.04 * Math.sin(t * 1.3), 0);
  rig.rotation.set(lerp(0.5, 0.06, rise) + 0.02 * Math.sin(t * 0.9), lerp(-0.3, -0.04, rise) + 0.03 * Math.sin(t * 0.7), lerp(-0.12, 0, rise));
  // finger press travelling along the pill
  const g = eIO((f - 95) / 120), pressAmt = Math.sin(Math.PI * cl((f - 90) / 135)) * 0.16;
  const px = lerp(-1.9, 1.0, g), py = 0.05;
  // jelly wobble after release and when the price jumps
  const wob = Math.exp(-Math.max(0, t - 3.75) * 2.2) * (t > 3.75 ? 1 : 0) * 0.05 + Math.exp(-Math.max(0, t - 6.0) * 2.5) * (t > 6.0 ? 1 : 0) * 0.04;
  const pos = pillGeo.attributes.position, a = pos.array;
  for (let i = 0; i < a.length; i += 3) {
    const x = base[i], y = base[i + 1], z = base[i + 2];
    const d2 = (x - px) * (x - px) + (y - py) * (y - py);
    const dent = z > 0 ? pressAmt * Math.exp(-d2 / 0.35) * (z / (R * ZS)) : 0;
    const bulge = pressAmt * 0.18 * Math.exp(-d2 / 1.2);
    a[i] = x; a[i + 1] = y * (1 + bulge) + wob * Math.sin(x * 2.2 - t * 14) * 0.6; a[i + 2] = z - dent + Math.sign(z) * wob * 0.3 * Math.sin(x * 1.7 + t * 11);
  }
  pos.needsUpdate = true; pillGeo.computeVertexNormals();
  labelMesh.position.z = R * ZS + 0.03;
  // price + glow
  const pk = eIO((f - 225) / 140);
  const price = P0 + (P1 - P0) * pk;
  label.draw('$' + price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}), '▲ ' + (1.38 + 1.04 * pk).toFixed(2) + '%');
  const surge = Math.max(0, Math.sin(Math.PI * cl((f - 225) / 170))) * 0.9 + 0.25 * Math.exp(-Math.abs(f - 446) / 10);
  glowMat.uniforms.t.value = t; glowMat.uniforms.k.value = 0.12 + surge * 0.9; glowLight.intensity = 3 + surge * 14;
  // Buy press
  const pr = Math.sin(Math.PI * cl((f - 436) / 16));
  btn.scale.set(1 + 0.06 * pr, 1 - 0.1 * pr, 1 - 0.3 * pr); buy.position.z = 0.58 - 0.1 * pr; buy.scale.setScalar(1 - 0.08 * pr);
};

// ---------- accumulation motion blur ----------
const rtSub = new THREE.WebGLRenderTarget(W, H, {type: THREE.HalfFloatType, samples: 4}), rtAcc = new THREE.WebGLRenderTarget(W, H, {type: THREE.HalfFloatType});
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const vs = 'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.,1.);}';
const addMat = new THREE.ShaderMaterial({uniforms: {tex: {value: null}, w: {value: 1}}, depthTest: false, vertexShader: vs,
  fragmentShader: 'uniform sampler2D tex; uniform float w; varying vec2 vUv; void main(){gl_FragColor=texture2D(tex,vUv)*w;}',
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor});
const outMat = new THREE.ShaderMaterial({uniforms: {tex: {value: rtAcc.texture}}, depthTest: false, blending: THREE.NoBlending, vertexShader: vs,
  fragmentShader: 'uniform sampler2D tex; varying vec2 vUv; void main(){gl_FragColor=vec4(texture2D(tex,vUv).rgb,1.);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}'});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), addMat); const qScene = new THREE.Scene(); qScene.add(quad);
window.renderFrame = (f, shutter = 0.5) => {
  renderer.setRenderTarget(rtAcc); renderer.setClearColor(0, 0); renderer.clear();
  for (let s = 0; s < SUB; s++) {
    pose(f + (SUB > 1 ? (s / SUB - 0.5) * shutter : 0));
    renderer.setRenderTarget(rtSub); renderer.clear(); renderer.render(scene, camera);
    quad.material = addMat; addMat.uniforms.tex.value = rtSub.texture; addMat.uniforms.w.value = 1 / SUB;
    renderer.setRenderTarget(rtAcc); renderer.autoClear = false; renderer.render(qScene, quadCam); renderer.autoClear = true;
  }
  quad.material = outMat; renderer.setRenderTarget(null); renderer.clear(); renderer.render(qScene, quadCam);
  return true;
};
document.title = 'ready';
</script>
</body></html>
