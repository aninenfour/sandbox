<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Shot 1 "coins": the Hotcoin symbol (extruded 3D logo) flies in and holds as the opening logo, then dives past the
// camera while real coins burst out from behind it and settle into a fanned row. Rendered frame by frame
// (window.renderFrame) with accumulation motion blur; transparent background.
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1920), H = +(q.get('h') || 1080), FPS = 60, SUB = +(q.get('sub') || 8);
const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: false});
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 0.75;
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);

// ---------- textures ----------
const loadImg = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const canvasTex = (draw, size = 1024) => { const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const sym = await loadImg('/public/brand/symbol-official-white.png');
const logoFace = async (file, bg) => { const im = await loadImg(file); return canvasTex((g, S) => {
  g.fillStyle = bg; g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, 7); g.fill();
  g.save(); g.beginPath(); g.arc(S / 2, S / 2, S * 0.4, 0, 7); g.clip(); g.drawImage(im, S * 0.1, S * 0.1, S * 0.8, S * 0.8); g.restore();
  g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = S * 0.012; g.beginPath(); g.arc(S / 2, S / 2, S * 0.445, 0, 7); g.stroke();
}, 512); };
const reed = canvasTex((g, S) => { g.fillStyle = '#808080'; g.fillRect(0, 0, S, S); for (let i = 0; i < 180; i++) { const x = (i / 180) * S; const gr = g.createLinearGradient(x, 0, x + S / 180, 0); gr.addColorStop(0, '#202020'); gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(1, '#202020'); g.fillStyle = gr; g.fillRect(x, 0, S / 180, S); } }, 1024);
reed.wrapS = THREE.RepeatWrapping; reed.colorSpace = THREE.NoColorSpace;

// ---------- coin geometry ----------
const R = 1, T = 0.17, B = 0.05;
const rimProfile = () => { const p = []; const n = 10;
  p.push(new THREE.Vector2(R * 0.9, T / 2)); p.push(new THREE.Vector2(R - B, T / 2));
  for (let i = 0; i <= n; i++) { const a = Math.PI / 2 - (i / n) * Math.PI; p.push(new THREE.Vector2(R - B + B * Math.cos(a), (T / 2 - B) * Math.sin(a) / Math.abs(Math.sin(a) || 1) * Math.min(1, Math.abs(Math.sin(a)) * 3) + 0)); }
  p.push(new THREE.Vector2(R - B, -T / 2)); p.push(new THREE.Vector2(R * 0.9, -T / 2)); return p; };
const rimGeo = new THREE.LatheGeometry(rimProfile(), 160);
const faceGeo = new THREE.CircleGeometry(R * 0.955, 128);
const makeCoin = (faceTex, edgeColor, metal = 1) => {
  const g = new THREE.Group();
  const edge = new THREE.Mesh(rimGeo, new THREE.MeshPhysicalMaterial({color: edgeColor, metalness: metal, roughness: 0.28, bumpMap: reed, bumpScale: 1.5, clearcoat: 0.6}));
  edge.rotation.x = Math.PI / 2; g.add(edge);
  const fm = new THREE.MeshPhysicalMaterial({map: faceTex, roughness: 0.32, metalness: 0.15, clearcoat: 1, clearcoatRoughness: 0.12});
  const f1 = new THREE.Mesh(faceGeo, fm); f1.position.z = T / 2 + 0.001; g.add(f1);
  const f2 = new THREE.Mesh(faceGeo, fm); f2.position.z = -T / 2 - 0.001; f2.rotation.y = Math.PI; g.add(f2);
  scene.add(g); return g;
};
const LIST = [['bitcoin', '#ffffff'], ['ethereum', '#ffffff'], ['solana', '#0b0e11'], ['binancecoin', '#ffffff'], ['ripple', '#23292f'], ['tether', '#ffffff'], ['dogecoin', '#ffffff'], ['tron', '#ffffff']];
const row = [];
for (const [id, bg] of LIST) row.push(makeCoin(await logoFace(`/public/promo4/coins/${id}.png`, bg), 0xd9dcd6, 1));

// ---------- Hotcoin symbol (opening logo) ----------
const logo = new THREE.Group(); scene.add(logo);
const shapes = await (await fetch('/art2/symbol-shapes.json')).json();
const SS = 1.55;
shapes.forEach((sh) => {
  const isDot = sh.area < 0.2;
  const shp = new THREE.Shape(sh.pts.map(([x, y]) => new THREE.Vector2(x * SS, y * SS)));
  const g = new THREE.ExtrudeGeometry(shp, {depth: isDot ? 0.26 : 0.2, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.03, bevelSegments: 8, curveSegments: 6});
  g.translate(0, 0, isDot ? -0.13 : -0.1);
  const m = isDot
    ? new THREE.MeshPhysicalMaterial({color: 0x7ec23a, emissive: 0x4a8a14, emissiveIntensity: 0.6, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.08})
    : new THREE.MeshPhysicalMaterial({color: 0xf4f5f0, roughness: 0.3, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.1});
  logo.add(new THREE.Mesh(g, m));
});

// ---------- lights ----------
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(-3, 4, 6); scene.add(key);
const sweep = new THREE.PointLight(0xffffff, 0, 30, 1.2); scene.add(sweep);
const limeRim = new THREE.PointLight(0xb8f26a, 40, 30, 1.4); limeRim.position.set(4, 1, -2); scene.add(limeRim);

// ---------- timeline ----------
const cl = (x) => Math.max(0, Math.min(1, x));
const eOut = (x) => 1 - Math.pow(1 - cl(x), 4), eIn = (x) => Math.pow(cl(x), 3), eIO = (x) => { x = cl(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;
const pose = (t) => {
  // A: logo flies in 0-0.9s, B: hero hold 0.9-2.0s, C: logo dives past camera 2.0-2.35s while coins burst out
  // from behind it 2.0-3.1s, D: fanned row, slow drift to 5.5s
  const a = eOut(t / 0.9), push = eIO((t - 0.9) / 1.2);
  const back = eOut((t - 2.1) / 1.1), drift = eIO((t - 3.0) / 2.5);
  camera.position.set(lerp(0, 0.1, back) + 0.25 * drift, lerp(0, 0.25, back), lerp(4.7 - 0.5 * push, 10.4, back) - 0.45 * drift);
  camera.lookAt(0, lerp(0, 0.05, back), 0);
  const dive = eIn((t - 2.0) / 0.38);
  logo.visible = t < 2.45;
  logo.position.set(lerp(1.4, 0, a) + 0.35 * dive, lerp(-0.8, 0.02, a) + 0.2 * dive, lerp(-24, 0, a) + 6.5 * dive);
  logo.rotation.set(lerp(0.8, 0.1, a) - 0.04 * push, (1 - a) * Math.PI * 4 - 0.28 + 0.2 * push + dive * 1.1, lerp(-0.4, 0, a));
  sweep.position.set(lerp(-3.5, 3.5, eIO((t - 0.95) / 1.1)), 1.2, 2.2); sweep.intensity = t > 0.9 && t < 2.1 ? 45 : 0;
  const n = row.length;
  row.forEach((c, i) => {
    const k = eOut((t - 2.02 - i * 0.045) / 1.0);
    c.visible = t > 2.0;
    const x = (i - (n - 1) / 2) * 0.97, z = -i * 0.02;
    const side = i % 2 ? 1 : -1;
    c.position.set(lerp(0, x, k), lerp(0, -0.05, k) + Math.sin(Math.PI * k) * side * (0.9 + 0.15 * i), lerp(-0.8, z, k) + Math.sin(Math.PI * k) * 0.5);
    c.rotation.set(0.06, -0.78 - (1 - k) * 1.2, (1 - k) * Math.PI * 3 * side);
    c.scale.setScalar(lerp(0.25, 1, eOut(k * 1.6)));
  });
};

// ---------- accumulation motion blur ----------
const rtOpts = {type: THREE.HalfFloatType, samples: 4};
const rtSub = new THREE.WebGLRenderTarget(W, H, rtOpts), rtAcc = new THREE.WebGLRenderTarget(W, H, {type: THREE.HalfFloatType});
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const addMat = new THREE.ShaderMaterial({uniforms: {tex: {value: null}, w: {value: 1}}, transparent: true, blending: THREE.AdditiveBlending, depthTest: false,
  vertexShader: 'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader: 'uniform sampler2D tex; uniform float w; varying vec2 vUv; void main(){gl_FragColor=texture2D(tex,vUv)*w;}'});
const outMat = new THREE.ShaderMaterial({uniforms: {tex: {value: rtAcc.texture}}, transparent: true, depthTest: false,
  vertexShader: 'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader: 'uniform sampler2D tex; varying vec2 vUv; void main(){vec4 c=texture2D(tex,vUv); gl_FragColor=vec4(c.a>0.001?c.rgb/c.a:vec3(0.),c.a);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}'});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), addMat); const qScene = new THREE.Scene(); qScene.add(quad);
window.renderFrame = (f, shutter = 0.5) => {
  renderer.setRenderTarget(rtAcc); renderer.setClearColor(0, 0); renderer.clear();
  for (let s = 0; s < SUB; s++) {
    pose((f + (s / SUB - 0.5) * shutter) / FPS);
    renderer.setRenderTarget(rtSub); renderer.setClearColor(0, 0); renderer.clear(); renderer.render(scene, camera);
    // premultiply so transparent edges average correctly
    quad.material = addMat; addMat.uniforms.tex.value = rtSub.texture; addMat.uniforms.w.value = 1 / SUB;
    addMat.fragmentShader = addMat.fragmentShader; renderer.setRenderTarget(rtAcc); renderer.autoClear = false; renderer.render(qScene, quadCam); renderer.autoClear = true;
  }
  quad.material = outMat; renderer.setRenderTarget(null); renderer.setClearColor(0, 0); renderer.clear(); renderer.render(qScene, quadCam);
  return true;
};
addMat.fragmentShader = 'uniform sampler2D tex; uniform float w; varying vec2 vUv; void main(){vec4 c=texture2D(tex,vUv); gl_FragColor=vec4(c.rgb*c.a, c.a)*w;}';
addMat.blending = THREE.CustomBlending; addMat.blendEquation = THREE.AddEquation;
addMat.blendSrc = THREE.OneFactor; addMat.blendDst = THREE.OneFactor; addMat.blendSrcAlpha = THREE.OneFactor; addMat.blendDstAlpha = THREE.OneFactor;
addMat.needsUpdate = true; outMat.blending = THREE.NoBlending; outMat.needsUpdate = true;
document.title = 'ready';
</script>
